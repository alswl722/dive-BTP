# 종합점수 가중치 (하드코딩 방지, 원칙3 config 기반)
#
# 축별 점수(재무 4축·기술 2축·축8)는 그대로 유지하고(docs/재무축_설계노트.md §5
# "종합점수 없음" 원칙), 그 위에 심사 스크리닝/정렬용 요약 지표로 종합점수를
# "보조적으로" 얹는다. 축별 breakdown은 항상 함께 노출 — 종합점수만 보고 판단하지
#않도록 화면 설계 시 반드시 축 breakdown을 병기할 것.
#
# 그룹 균등 배분: 재무/기술/정합성 세 그룹을 각 1/3로 맞춘 뒤 그룹 내부는 균등분배.
# 재무는 세부축이 4개라 그룹 내부는 축당 1/12, 기술은 2개라 축당 1/6, 축8은 1개라
# 그대로 1/3. "우리가 임의로 어느 세부축이 더 중요하다고 정하지 않았다"는 방어
# 논리를 유지하면서도, 세부축 개수 차이로 재무가 과대/기술이 과소평가되는 것을 방지.
#
# 본선 데이터에서 실측 후 팀 합의로 조정 가능 — 축1~9 다른 config들과 동일 원칙.

groups:
  finance: 0.3333    # 성장성·수익성·효율성·안정성 (팀원A)
  tech: 0.3333       # R&D·특허 / NTIS (팀원B)
  alignment: 0.3334  # 축8 사업정체성 정합성 (팀원D) — 합 1.0 맞추기 위해 나머지 배분

# 그룹 내부는 균등 배분이 기본(세부축 개수로 자동 나눔)이지만, 세부축마다 원지표
# 개수가 크게 다르면 "지표 1개짜리 축"과 "지표 10개짜리 축"이 동일 발언권을 갖는
# 문제가 생긴다. 여기 명시된 축은 그룹 내 균등분배 대신 이 절대값을 쓰고,
# 나머지 그룹 가중치를 override 없는 축들끼리 다시 균등분배한다.
#
# 재무 그룹 세부축 원지표 개수(scoring_finance.py SCORE_COLS 기준, 2026-07-20 실측):
#   성장성 6 / 수익성 10 / 효율성 1 / 안정성 5
# 효율성은 총자산회전율 단일 지표라 다른 세부축과 균등 배분하면 지표 1개가
# 축1개 전체 발언권을 독식한다(다른 축은 지표 5~10개가 뭉쳐 만든 값). 완전
# 지표수 비례(3~10배 차이)까지 가면 이번엔 수익성이 과대대표되므로, 절충으로
# 효율성만 그룹 내 다른 축(성장성/수익성/안정성) 몫의 절반으로 하한.
# 재무 그룹 0.3333 중 효율성 0.0417(≈1/2 × 균등 0.0833), 나머지 3축이 남은
# 0.2916을 균등분배(축당 0.0972).
axis_overrides:
  효율성: 0.0417
# 예시(다른 확장):
#   안정성: 0.5   # 그룹 내 다른 축과 무관하게 절대 비중 지정 시 사용

axes:
  finance:
    - 성장성
    - 수익성
    - 효율성
    - 안정성
  tech:
    - R&D특허
    - NTIS
  alignment:
    - 정합성   # businessFit.score

# 최저축 캡: 종합점수 = min(가중평균, 최저축점수 + cap_margin)
# 재무축 실증(2379 사례) — 평균은 "한 축이 무너지고 있다"는 신호를 다른 축 점수로
# 희석시킨다. 캡을 씌워 최저축이 종합점수의 상한을 정하게 해서, 특정 축이
# 심각하게 낮은 기업의 종합점수가 다른 축 덕에 과도하게 높아지는 것을 방지.
cap_margin: 15.0

# 결측 가드 — 유효 축(NaN 아닌 축) 비율이 이 미만이면 종합점수 자체를 NaN 처리.
# scoring_finance.py의 MIN_AXIS_RATIO(0.5)와 동일 원칙(결측이 점수를 왜곡 방지).
min_valid_axis_ratio: 0.5
