# 부산광역시 제6차 전략산업 KSIC코드 지정 현황 (외부 데이터)
#
# 출처: 부산광역시 제6차 전략산업 육성 마스터 플랜(별첨1) — 원본 PDF 텍스트 레이어에서
#       프로그램 파싱 + footer 검증(산업별 고유코드 수, 총합계 362개) 100% 일치 확인.
#       확인일 2026-07-22.
# 9대 전략산업: 디지털테크·에너지테크·바이오헬스·미래모빌리티·융합부품소재·
#              라이프스타일·해양·금융·문화관광
#
# 코드 포맷: KSIC 11차 세세분류(5자리) 앞에 대분류 알파벳을 붙여 companies.ksic_code와
#           동일 포맷(예: C29299)으로 정규화 완료 — 국세청 공식 「업종코드-11차
#           표준산업분류 연계표」(2023년 귀속, 1786건 실측)로 대분류 구간 교차검증됨.
#
# 구분:
#   unique(고유) — 해당 산업에만 속하는 코드. 매칭 시 강한 신호.
#   common(공통) — 여러 산업에 걸쳐 공용으로 지정된 범용 코드(연구개발업·측정업 등).
#                  매칭 시 약한 신호 — 여러 산업 후보가 동시에 걸릴 수 있어 단독으로
#                  "이 산업 소속"이라 단정하지 않는다.
#
# ⚠️ 시점 캐비엇: 이 표는 2025년 확정된 "제6차"(2026년 시행) 기준이다. 부산TP
#    지원기록(support_records, 2022~2024년)에 이 최신 버전을 소급 적용하는 것 —
#    해당 기간에 더 이전 차수가 적용됐을 가능성 있음. 본선에서 필요시 주최측 확인.
#
