# 기술수준별 산업분류 (외부 데이터) — KSIC 중분류 → 기술집약도 등급
#
# 출처: OECD 기술집약도 분류(ISIC Rev.4 기준 High/Medium-high/Medium-low/Low
#       technology manufacturing)를 한국표준산업분류(KSIC) 중분류에 대응시킨 표.
#       통계청·KISTEP 등 국내 연구에서 널리 사용하는 표준 구분.
#
# 용도: ★ NTIS 이력이 없어 과학기술표준분류를 못 얻는 기업의 **폴백**.
#       업종코드만 있으면 기술수준 등급이 나온다 → "기술분야 미상" 문제 완화.
#
# ⚠️ 한계
#  - OECD 분류는 **제조업 대상**. 서비스업은 별도(knowledge_intensive_services)로 표기.
#  - KSIC C31(기타 운송장비)은 선박·철도·항공이 섞여 있다. OECD는 항공우주를 고위기술로
#    보지만 KSIC 중분류로는 분리가 안 되므로 **중저위(선박 기준)** 로 둔다.
#    소분류(C313 항공기)까지 오면 상향 조정 필요 — exceptions에 명시.
#  - 원 출처표를 그대로 옮긴 것이 아니라 OECD 기준을 KSIC에 대응시킨 것.
#    본선 전 통계청 원표로 검증할 것.

levels:
  고위기술:
    - C21   # 의료용 물질 및 의약품
    - C26   # 전자부품·컴퓨터·영상·음향 및 통신장비
    - C27   # 의료·정밀·광학기기 및 시계
  중고위기술:
    - C20   # 화학물질 및 화학제품(의약품 제외)
    - C28   # 전기장비
    - C29   # 기타 기계 및 장비
    - C30   # 자동차 및 트레일러
  중저위기술:
    - C19   # 코크스·연탄 및 석유정제품
    - C22   # 고무 및 플라스틱제품
    - C23   # 비금속 광물제품
    - C24   # 1차 금속
    - C25   # 금속가공제품(기계·가구 제외)
    - C31   # 기타 운송장비(선박 등) — 항공기는 예외 참조
    - C34   # 산업용 기계 및 장비 수리업
  저위기술:
    - C10   # 식료품
    - C11   # 음료
    - C12   # 담배
    - C13   # 섬유제품
    - C14   # 의복·의복액세서리·모피
    - C15   # 가죽·가방·신발
    - C16   # 목재·나무제품
    - C17   # 펄프·종이·종이제품
    - C18   # 인쇄·기록매체 복제업
    - C32   # 가구
    - C33   # 기타 제품 제조업

# 소분류 단위 예외 (중분류 등급을 덮어씀)
exceptions:
  C313: 고위기술   # 항공기·우주선 및 부품 (OECD 기준 고위기술)

# 제조업이 아닌 지식기반 서비스 (OECD 제조업 기술수준 분류 대상 아님)
knowledge_intensive_services:
  - J58   # 출판업(소프트웨어 개발·공급 포함)
  - J59
  - J60
  - J61   # 통신업
  - J62   # 컴퓨터 프로그래밍·시스템 통합 및 관리
  - J63   # 정보서비스업
  - M70   # 연구개발업
  - M71   # 전문서비스업
  - M72   # 건축기술·엔지니어링
  - Q86   # 보건업

unknown_label: 기술수준 미분류
