# 부처명 정규화 매핑 (transforms.normalize_ministry)
# 컬럼을 코드에 하드코딩하지 않기 위한 config (CLAUDE.md 개발원칙 3).
#
# 배경: NTIS(주관부처명)·부산TP 사업목록(부처명) 원본에 정식명칭/약칭/오탈자가
# 혼재할 수 있다("개보위" vs "개인정보보호위원회" 등). 이걸 정규화하지 않으면
# 부처다양성(nunique) 집계가 별칭 수만큼 부풀려지고, 주력부처(최빈값) 표기도
# 화면마다 들쭉날쭉해진다.
#
# alias_to_canonical: 별칭(소문자/공백 제거 비교) → 정식명칭. 여기 없는 값은
# 원본 문자열을 그대로 유지한다(임의 추정 금지 — tech_domain.yaml unknown_label과
# 동일 원칙). 새 별칭이 발견되면 이 파일만 수정하면 된다.
alias_to_canonical:
  # 개인정보보호위원회
  개보위: 개인정보보호위원회
  개인정보위: 개인정보보호위원회
  개인정보보호위: 개인정보보호위원회

  # 과학기술정보통신부
  과기부: 과학기술정보통신부
  과기정통부: 과학기술정보통신부
  미래부: 과학기술정보통신부
  미래창조과학부: 과학기술정보통신부

  # 중소벤처기업부
  중기부: 중소벤처기업부

  # 산업통상자원부
  산업부: 산업통상자원부
  산자부: 산업통상자원부

  # 해양수산부
  해수부: 해양수산부

  # 농림축산식품부
  농식품부: 농림축산식품부

  # 보건복지부
  복지부: 보건복지부

  # 환경부
  환경부: 환경부

  # 고용노동부
  고용부: 고용노동부
  노동부: 고용노동부

  # 행정안전부
  행안부: 행정안전부

  # 국토교통부
  국토부: 국토교통부

  # 문화체육관광부
  문체부: 문화체육관광부

  # 교육부
  교육부: 교육부

  # 특허청
  특허청: 특허청

  # 중소기업기술정보진흥원 등 산하기관은 소관부처로 묶지 않고 별도 유지
  # (기관 ≠ 부처 — 임의로 상위부처에 합치면 정보 손실)

# 결측(NaN/공백) 표기. domain_tech.py의 도메인_출처=미상과 동일한 라벨을 쓴다.
missing_label: 미상
