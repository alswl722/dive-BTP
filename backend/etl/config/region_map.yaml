# NTIS 지역구분명 정규화 매핑 (transforms.normalize_region)
# 컬럼을 코드에 하드코딩하지 않기 위한 config (CLAUDE.md 개발원칙 3).
#
# 배경: NTIS(주관) 지역구분명 원본(30,299행)에 입도(정밀도) 불일치·시도명 중복
# 표기·행정구역 개편·옛 구명/오입력이 섞여 고유값이 126종까지 부풀어 있다
# (docs/특허유효_NTIS지역_처리노트.md §2 실측 근거). 이걸 정규화하지 않으면
# 지역 다양성(nunique) 집계가 표기 편차만큼 부풀려지고, 화면 표기도 들쭉날쭉해진다.
#
# 처리 방식: "시도 레벨 롤업" — 원칙적으로 앞 토큰(시도)만 남긴다. 단 부산은
# 부산TP 발제 데이터 특성상 구 단위 분석이 의미 있어 "시도 구" 2단을 그대로 유지한다
# (부산 세부 구는 alias_to_canonical에 없으면 원본 그대로 통과 — 아래 alias는
# 표기 편차 교정용이지 부산 구 정보를 지우는 게 아니다).
#
# alias_to_canonical: 원본 전체 문자열(공백 제거 비교) → 정식 표기.
# 여기 없는 값은 시도 롤업 규칙(첫 토큰)을 적용한다. 새 별칭이 발견되면
# 이 파일만 수정하면 된다(ministry_map.yaml과 동일 원칙).
alias_to_canonical:
  # 시도명 중복 표기 (앞 토큰 반복)
  세종특별자치시세종특별자치시: 세종특별자치시
  해외해외: 해외

  # 행정구역 개편 — 2024 전북특별자치도 전환. 개편 전후 표기 통일
  전북특별자치도전주시: 전라북도
  전라북도전주시: 전라북도
  전라북도군산시: 전라북도
  전라북도완주군: 전라북도

  # 결측·기타 표기 통일
  기타기타: 미상
  부산광역시기타: 부산광역시  # 부산은 구 단위 유지 방침이라 "기타"만 시도로 롤업

# 부산은 "시도 구" 2단을 그대로 보존(시도 롤업 예외). 이 접두어로 시작하는
# 원본값은 alias_to_canonical에 없으면 (위 부산 기타 제외) 원본을 그대로 쓴다.
keep_district_prefix:
  - 부산광역시

# 결측(NaN/공백) 표기. ministry_map.yaml/domain_tech.py의 도메인_출처=미상과 동일 라벨.
missing_label: 미상
