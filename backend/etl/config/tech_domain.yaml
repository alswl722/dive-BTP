# 기술 도메인 매핑 규칙 (domain_tech.py)
# 컬럼·분류값을 코드에 하드코딩하지 않기 위한 config (CLAUDE.md 개발원칙 3).
# 본선 데이터에서 분류명이 달라지면 이 파일만 수정한다.

# NTIS 과학기술표준분류명(소분류) → 도메인 대분류 롤업.
# 국가과학기술표준분류체계 공식 표를 확보하면 그것으로 대체할 것(현재는 키워드 기반 롤업).
# 매칭은 "분류명에 키워드 포함" 방식(부분일치, 위에서부터 우선).
domain_rollup:
  해양·수산:
    - 해양
    - 수중
    - 갑판
    - 조선
  환경·에너지:
    - 오염
    - 환경정화
    - 에너지
    - 수소
    - 가스
  바이오·의료:
    - 바이오
    - 생체
    - 치료
    - 진단
  ICT·소프트웨어:
    - 소프트웨어
    - S/W
    - 인터넷
    - 가상현실
    - 인공지능
  재난·안전:
    - 재난
    - 안전
    - 위험감지
  기계·소재부품:
    - 부품
    - 기계
    - 인발
    - 소재
    - 계측
    - 측정
  농업:
    - 농업

# 부산TP 4대 중점사업 축 (OT 자료 기준) ← 도메인/키워드 매핑
# 한 기업이 복수 축에 걸릴 수 있음(모두 표기).
btp_focus:
  탄소중립 산업체질 강화:
    - 에너지
    - 수소
    - 오염
    - 환경정화
    - 가스
    - 탄소
  바이오 라이프:            # 탄소중립 축의 하위 방향이나 판별 편의상 분리
    - 바이오
    - 생체
    - 치료
    - 진단
  디지털전환 체계적 지원:
    - 소프트웨어
    - S/W
    - 인터넷
    - 가상현실
    - 인공지능
    - 디지털
  지역특화산업 혁신선도:
    - 해양
    - 수중
    - 갑판
    - 조선
    - 부품
    - 기계
    - 재난
    - 안전

# NTIS 이력이 없는 기업의 폴백: KSIC 대분류/중분류 → 도메인
# (표준분류 없음 → 업종으로 추정. 추정임을 결과에 표기한다.)
ksic_fallback:
  C31: 해양·수산          # 선박 구성 부분품
  C29: 기계·소재부품       # 일반목적용 기계
  C24: 기계·소재부품       # 1차 금속
  C25: 기계·소재부품       # 금속가공
  C21: 바이오·의료         # 의료용품
  J58: ICT·소프트웨어      # 소프트웨어 개발
  J62: ICT·소프트웨어
  Q87: 바이오·의료         # 사회복지 서비스(헬스케어 인접)

# 폴백에도 안 걸리면 이 값 (임의 추정 금지 — 미상으로 명시)
unknown_label: 기술분야 미상
