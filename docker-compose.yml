services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foedev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foedev}
      POSTGRES_DB: ${POSTGRES_DB:-foedev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foedev}:${POSTGRES_PASSWORD:-foedev}@db:5432/${POSTGRES_DB:-foedev}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    # NEXT_PUBLIC_API_BASE_URL은 의도적으로 비워둠: backend/app에 라우터
    # (/companies, /rankings, /dashboard)가 아직 없어서, 지금 값을 채우면 lib/api.ts가
    # 404를 그대로 던진다. 비워두면 lib/api.ts가 fixture(frontend/lib/fixtures/*.json,
    # 실 ETL 데이터로 이미 생성됨)로 자동 폴백해 docker compose up만으로 화면이 뜬다.
    # 라우터가 생기면 아래처럼 채울 것 — 프론트 컨테이너 "안"에서 서버컴포넌트가
    # fetch하므로 localhost가 아니라 컨테이너 네트워크상의 서비스명(backend)을 써야 함
    # (localhost로 두면 프론트 컨테이너 자기 자신을 가리켜서 ECONNREFUSED남):
    #   environment:
    #     NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
